<div>
    <h2 class="text-center text-primary">{{title}}</h2>
    <img class=" mx-auto d-block mt-4" width="350" height="350" [src]="imageLink" alt="" >
</div>
<div class="container">
    <div class="row">
        <div class="col-sm-9">
            <input class=" form-control mt-4" placeholder="New Task" [(ngModel)]="newTask" >
        </div>
        <div class="col-sm-3">
         <button class="btn btn-primary mt-4" (click)="addTask()">ADD TASK</button>
         <button class="btn btn-success mt-4 mx-1" [disabled]="!isEditMode" (click)="saveTask()">Save EditTask</button> 
        </div>
        <div class="row">
            <div class="col-sm-12">
                @if(isAvailable){
                    <table class="table table-striped table-danger mt-3">
                        <thead>
                            <tr>
                                <th>item</th>
                                <th>Edit</th>
                                
                                <th>Rmove</th>
                            </tr>
                        </thead>
                        <tbody>
                            @for( i of tasks;track $index){
                                <tr>
                                    <td>{{i}}</td>
                                    <td><button class="btn btn-warning" (click)="editTtask($index)">EDIT</button></td>
                                    <td><button class="btn btn-danger" (click)="removTask($index)">REMOVE</button></td>
                                  
                                </tr>

                            }
                            
                        </tbody>
                    </table>
                }
                
                
            </div>
        </div>
    </div>
</div>
